<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1 OF 16000 — Gallery</title><style>:root{--bg:#f4f3ee;--card:#fff;--line:#d9d7d0;--ink:#111;--mut:#777}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px Inter,Arial,sans-serif}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{padding:24px 16px;border-right:1px solid var(--line);background:#faf9f5;position:sticky;top:0;height:100vh}.logo{font-size:30px;font-weight:950;line-height:.85}.logo small{display:block;font-size:9px;letter-spacing:1.8px;margin-top:12px}.nav{display:grid;gap:5px;margin-top:28px}.nav a{color:#666;text-decoration:none;padding:11px;border-radius:8px;font-weight:850}.nav a.on{background:#111;color:#fff}.main{padding:28px 3vw 60px;min-width:0}.top h1{font-size:48px;letter-spacing:-2.7px;margin:5px 0 4px}.ey{font-size:9px;letter-spacing:1.5px;color:var(--mut);font-weight:900}.source{font:10px ui-monospace,Menlo,monospace;color:#555;word-break:break-all}.controls{margin:20px 0 18px;display:grid;grid-template-columns:auto auto auto 1fr auto auto;gap:8px;align-items:end}.field label{display:block;font-size:9px;color:#666;font-weight:850;margin-bottom:4px}input,select,button{font:inherit}.field input,.field select{height:38px;border:1px solid #c9c7c0;border-radius:8px;background:#fff;padding:0 10px}.field input{width:130px}.btn{height:38px;border:1px solid #111;background:#111;color:#fff;padding:0 14px;border-radius:8px;font-weight:850;cursor:pointer}.btn.out{background:#fff;color:#111;border-color:#bbb}.status{justify-self:end;align-self:center;font-size:11px;color:#666}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer}.thumb{aspect-ratio:1;background:#e9e9e5;display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:contain}.meta{padding:9px 10px}.meta b{display:block;font-size:12px}.meta span{display:block;font-size:9px;color:#777;margin-top:3px}.skeleton{width:100%;height:100%;background:linear-gradient(90deg,#ecebe7 25%,#f6f5f2 37%,#ecebe7 63%);background-size:400% 100%;animation:sh 1.4s ease infinite}@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}.pager{display:flex;justify-content:center;gap:8px;margin:22px 0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:50;padding:30px}.modal.on{display:flex}.viewer{background:#111;color:#fff;max-width:min(92vw,1000px);width:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;border:1px solid #444;border-radius:14px;overflow:hidden}.viewerimg{background:#050505;display:flex;align-items:center;justify-content:center;min-height:65vh}.viewerimg img{max-width:100%;max-height:82vh;object-fit:contain}.viewerinfo{padding:22px}.viewerinfo h2{font-size:28px;margin:3px 0 12px}.viewerinfo p{color:#aaa;line-height:1.45}.close{position:fixed;right:22px;top:18px;background:#fff;color:#111;border:0;border-radius:99px;width:36px;height:36px;font-weight:900;cursor:pointer}.vnav{display:flex;gap:7px;margin-top:16px}.vnav button{flex:1}.empty{padding:30px;text-align:center;color:#777}@media(max-width:1200px){.grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:950px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.grid{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr 1fr}.status{grid-column:1/-1;justify-self:start}.viewer{grid-template-columns:1fr}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.top h1{font-size:38px}}</style></head><body><div class="app"><aside class="side"><div class="logo">1 OF<br>16000<small>BY PIERRE REMIXES</small></div><div class="nav"><a href="/">Live NFT Manager</a><a class="on" href="/gallery.html">Gallery</a><a href="/#deflation">Opepen Deflation</a><a href="/#gold">Opepen Gold</a><a href="/builder.html">Schematic Builder</a><a href="/traits.html">Visual Genome</a></div></aside><main class="main"><div class="top"><div class="ey">OFFICIAL COLLECTION · LIVE CONTRACT IPFS</div><h1>16,000 Gallery</h1><div class="source" id="source">Reading official collection IPFS…</div></div><div class="controls"><div class="field"><label>JUMP TO TOKEN</label><input id="jump" type="number" min="1" max="16000" value="1"></div><button class="btn" onclick="jumpTo()">GO</button><div class="field"><label>ITEMS PER PAGE</label><select id="pageSize" onchange="setPageSize()"><option>24</option><option selected>48</option><option>96</option></select></div><div></div><button class="btn out" id="cycleBtn" onclick="toggleCycle()">AUTO CYCLE</button><div class="status" id="status">Loading…</div></div><div id="grid" class="grid"></div><div class="pager"><button class="btn out" onclick="prevPage()">← PREVIOUS</button><button class="btn out" onclick="nextPage()">NEXT →</button></div></main></div><div class="modal" id="modal"><button class="close" onclick="closeModal()">×</button><div class="viewer"><div class="viewerimg"><img id="viewImg"></div><div class="viewerinfo"><div class="ey">1 OF 16000</div><h2 id="viewName"></h2><p id="viewDesc"></p><div id="viewToken" class="source"></div><div class="vnav"><button class="btn out" onclick="viewPrev()">←</button><button class="btn out" onclick="viewNext()">→</button></div></div></div></div><script>const TOTAL=16000,FALLBACK_BASE='ipfs://bafybeib2xzbudn7qkbnm34jtzhrduxbkjen6bwlx53qt3ecvo7tkiujkq4/',$=id=>document.getElementById(id);let baseURI='',page=0,pageSize=48,cycleTimer=null,currentToken=1,cache=new Map();const gateways=['https://dweb.link/ipfs/','https://ipfs.io/ipfs/','https://ipfs.filebase.io/ipfs/'];function ipfsToHttp(uri,g=0){if(!uri)return'';if(uri.startsWith('ipfs://'))return gateways[g]+uri.slice(7).replace(/^ipfs\//,'');return uri}function baseJoin(name){return baseURI.replace(/\/?$/,'/')+name}function metadataCandidates(t){let names=[String(t),t+'.json'];let out=[];for(const n of names)for(let g=0;g<gateways.length;g++)out.push(ipfsToHttp(baseJoin(n),g));return out}async function getJSON(t){if(cache.has(t))return cache.get(t);let last='';for(const u of metadataCandidates(t)){try{let r=await fetch(u,{cache:'force-cache'});if(!r.ok){last='HTTP '+r.status;continue}let m=await r.json();let o={token:t,meta:m,metaUrl:u};cache.set(t,o);return o}catch(e){last=e.message}}throw Error(last||'metadata unavailable')}function resolveImageUri(image,metaUrl){if(!image)return'';if(image.startsWith('ipfs://')||image.startsWith('http://')||image.startsWith('https://')||image.startsWith('data:'))return image;if(metaUrl&&/^https?:/.test(metaUrl)){let u=new URL(metaUrl);u.pathname=u.pathname.replace(/[^/]*$/,'')+image.replace(/^\.\//,'');return u.toString()}return image}function imgCandidates(uri){if(!uri)return[];if(uri.startsWith('ipfs://'))return gateways.map(g=>g+uri.slice(7).replace(/^ipfs\//,''));return[uri]}function makeCard(t){let el=document.createElement('div');el.className='card';el.innerHTML=`<div class=thumb><div class=skeleton></div></div><div class=meta><b>#${t}</b><span>Loading official metadata…</span></div>`;el.onclick=()=>openToken(t);hydrate(el,t);return el}async function hydrate(el,t){try{let o=await getJSON(t),m=o.meta||{},uri=resolveImageUri(m.image||m.image_url||m.image_data||'',o.metaUrl),imgs=imgCandidates(uri),thumb=el.querySelector('.thumb'),im=new Image(),i=0;im.alt=m.name||('#'+t);im.onload=()=>{thumb.innerHTML='';thumb.appendChild(im)};im.onerror=()=>{i++;if(i<imgs.length)im.src=imgs[i];else thumb.innerHTML='<div class=empty>Image unavailable</div>'};if(imgs.length)im.src=imgs[0];else thumb.innerHTML='<div class=empty>No image</div>';el.querySelector('.meta b').textContent=m.name||('#'+t);el.querySelector('.meta span').textContent='Token #'+t}catch(e){el.querySelector('.thumb').innerHTML='<div class=empty>Unavailable</div>';el.querySelector('.meta span').textContent='Token #'+t+' · failed'}}function renderPage(){let start=page*pageSize+1,end=Math.min(TOTAL,start+pageSize-1);$('grid').innerHTML='';let f=document.createDocumentFragment();for(let t=start;t<=end;t++)f.appendChild(makeCard(t));$('grid').appendChild(f);$('status').textContent=`${start.toLocaleString()}–${end.toLocaleString()} of 16,000 · page ${page+1}/${Math.ceil(TOTAL/pageSize)}`;window.scrollTo({top:0,behavior:'smooth'})}function prevPage(){page=Math.max(0,page-1);renderPage()}function nextPage(){page=Math.min(Math.ceil(TOTAL/pageSize)-1,page+1);renderPage()}function setPageSize(){let first=page*pageSize+1;pageSize=+$('pageSize').value;page=Math.floor((first-1)/pageSize);renderPage()}function jumpTo(){let t=Math.max(1,Math.min(TOTAL,+$('jump').value||1));page=Math.floor((t-1)/pageSize);renderPage();setTimeout(()=>openToken(t),250)}function toggleCycle(){if(cycleTimer){clearInterval(cycleTimer);cycleTimer=null;$('cycleBtn').textContent='AUTO CYCLE';return}$('cycleBtn').textContent='STOP CYCLE';cycleTimer=setInterval(()=>{page=page>=Math.ceil(TOTAL/pageSize)-1?0:page+1;renderPage()},5000)}async function openToken(t){currentToken=t;$('modal').classList.add('on');$('viewName').textContent='Loading #'+t+'…';$('viewDesc').textContent='';$('viewImg').removeAttribute('src');$('viewToken').textContent='Token #'+t;try{let o=await getJSON(t),m=o.meta||{},uri=resolveImageUri(m.image||m.image_url||m.image_data||'',o.metaUrl),imgs=imgCandidates(uri),i=0,im=$('viewImg');im.onerror=()=>{i++;if(i<imgs.length)im.src=imgs[i]};if(imgs.length)im.src=imgs[0];$('viewName').textContent=m.name||('Token #'+t);$('viewDesc').textContent=m.description||'';$('viewToken').textContent=`Token #${t}\nMetadata: ${o.metaUrl}\nImage: ${m.image||m.image_url||''}`}catch(e){$('viewName').textContent='Token #'+t;$('viewDesc').textContent='Metadata unavailable from current IPFS gateways.'}}function closeModal(){$('modal').classList.remove('on')}function viewPrev(){openToken(Math.max(1,currentToken-1))}function viewNext(){openToken(Math.min(TOTAL,currentToken+1))}document.addEventListener('keydown',e=>{if(!$('modal').classList.contains('on'))return;if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft')viewPrev();if(e.key==='ArrowRight')viewNext()});async function init(){baseURI=FALLBACK_BASE;let label='Official project IPFS: '+baseURI;try{let r=await fetch('/api/contract/main',{cache:'no-store'});if(r.ok){let c=await r.json();if(c.baseURI){baseURI=c.baseURI;label='Live contract baseURI: '+baseURI}}}catch(e){}$('source').textContent=label;renderPage()}init();</script></body></html>
